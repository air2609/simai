services:
  db:
    image: postgres:16-alpine
    container_name: simai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: simai
      POSTGRES_USER: simai
      POSTGRES_PASSWORD: simai
    ports:
      - "5432:5432"
    volumes:
      - simai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simai -d simai"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: simai-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@simai.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  simai_pgdata:
