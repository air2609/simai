spring:
  application:
    name: simai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/simai}
    username: ${DB_USER:simai}
    password: ${DB_PASSWORD:simai}

  jpa:
    # Skema dikelola Flyway (db/migration). Ubah ke "validate" untuk memvalidasi mapping entity.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

simai:
  jwt:
    # Base64 secret untuk HS256 (min. 32 byte). WAJIB diganti via env di production.
    secret: ${JWT_SECRET:c2ltYWktand0LXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMTIzNDU2Nzg5MA==}
    expiration-ms: 86400000 # 24 jam

springdoc:
  swagger-ui:
    path: /swagger-ui.html
